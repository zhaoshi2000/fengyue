server.address=${APP_HOST:127.0.0.1}
server.port=${APP_PORT:3000}
server.servlet.session.persistent=false
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/aquantancee?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USER:aquantancee}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.web.resources.static-locations=file:./public/,classpath:/static/
spring.web.resources.cache.period=0
server.error.include-message=never
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
