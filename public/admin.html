<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台管理 · 风月</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/admin.css">
  <script src="/admin.js" defer></script>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <a class="brand" href="/">风月 <small>管理后台</small></a>
      <p class="side-caption">CONTENT STUDIO</p>
      <nav aria-label="后台导航"><button class="nav-button active" data-view="overview">◈ <span>总览</span></button><button class="nav-button" data-view="items">▤ <span>作品管理</span></button><button class="nav-button" data-view="users">♧ <span>用户管理</span></button></nav>
      <div class="side-bottom"><a href="/">← 返回探索</a><span id="adminIdentity">正在验证身份…</span></div>
    </aside>
    <main class="admin-main">
      <header class="admin-header"><div><span class="eyebrow">FENGYUE / ADMIN</span><h1 id="pageTitle">管理总览</h1><p id="pageSubtitle">查看内容和社区运行情况</p></div><button id="refreshButton" class="refresh-button">↻ 刷新数据</button></header>
      <div id="accessMessage" class="access-message" hidden></div>
      <div id="adminContent" hidden>
        <section id="overviewPanel" class="panel"><div class="section-heading"><h2>数据概览</h2><span>实时读取本地 MySQL</span></div><div id="statsGrid" class="stats-grid"></div><div class="tip-card"><span>✦</span><div><strong>管理提示</strong><p>在作品管理中可查看、审核并删除作品；在用户管理中可查看账号和删除普通用户。删除会要求再次确认。</p></div></div></section>
        <section id="listPanel" class="panel" hidden><div class="list-toolbar"><div><h2 id="listTitle">作品管理</h2><p id="listDescription">管理已发布的角色卡</p></div><form id="searchForm" class="search-form"><input id="searchInput" type="search" maxlength="80" placeholder="搜索标题或作者" autocomplete="off"><button type="submit">搜索</button></form></div><div id="listStatus" class="list-status"></div><div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><div class="pagination"><button id="previousPage">上一页</button><span id="pageInfo">第 1 页</span><button id="nextPage">下一页</button></div></section>
      </div>
      <div id="toast" class="toast" role="status" hidden></div>
    </main>
  </div>
</body>
</html>
